name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: slopsmith/ps5slop
          ref: trunk
          path: ps5slop
          sparse-checkout: docs/user
      - uses: cachix/install-nix-action@v31
      - name: Fetch accepted compatibility reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/slopsmith/ps5slop-compat/issues?state=all&labels=accepted&per_page=100' --jq '.[]' \
            | jq -s . > "$RUNNER_TEMP/issues.json"
      - name: Generate docs and compatibility pages
        run: |
          nix develop . -c cargo run --release -p sitegen -- docs --ps5slop ps5slop
          nix develop . -c cargo run --release -p sitegen -- compat --issues "$RUNNER_TEMP/issues.json"
      - name: Build
        run: nix develop . -c zola build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
