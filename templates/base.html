<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="{{ get_url(path='fonts/inter.woff2') }}" as="font" type="font/woff2" crossorigin>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<!--
THESIS: An emulator project site played straight, in the line of Dolphin, PCSX2 and Vita3K: download, compatibility and docs, with screenshots and real results as the proof.
OWN-WORLD: Neutral charcoal ground, one blue accent per project, Inter throughout, few boxes. Compatibility is a five-segment meter in status colors.
STORY: Visitors see what the project is, whether their game runs, and download or read on.
FIRST VIEWPORT: ps5slop: name, one line, download on the left; a screenshot on the right.
FORM: Category standard, pinned by the user (references: Dolphin, PCSX2, Vita3K, Ryujinx). No seed.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<a class="skip" href="#main">Skip to content</a>
{% block header %}{% endblock %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% block footer %}
<footer class="site-footer">
  <div class="wrap">
        <p>Software written by AI agents, with little code review. <a href="{{ config.extra.github }}">GitHub</a></p>
  </div>
</footer>
{% endblock %}
</body>
</html>
