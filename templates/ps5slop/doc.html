{% extends "ps5slop/base.html" %}
{% block title %}{{ page.title }} · ps5slop docs{% endblock %}
{% block content %}
{% set section = get_section(path="ps5slop/docs/_index.md") %}
<div class="wrap docs">
  {% include "ps5slop/docs-nav.html" %}

    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </article>
</div>
{% endblock %}
